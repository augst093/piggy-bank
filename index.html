<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Копилка">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Копилка</title>
<style>
  :root{
    --bg:#000; --card:#1a1a1a; --line:#3a3a3a; --txt:#fff; --dim:#b3b3b3;
    --acc:#fff; --red:#ff3b30; --grn:#30e060;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:ui-rounded,"SF Pro Rounded",-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;font-weight:600;-webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;overscroll-behavior:none}
  #app{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
    padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 20px)}
  button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .goalbtn{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:800;padding:8px 0;max-width:75%}
  .goalbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .goalbtn svg{flex:none;opacity:.5}
  .icon{width:40px;height:40px;border-radius:20px;background:var(--card);display:grid;place-items:center;color:#fff}
  .hero{display:grid;place-items:center;padding:28px 0 8px;position:relative}
  .ring{width:260px;height:260px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:10;stroke-linecap:round}
  .ring .bg{stroke:#2a2a2a}
  .ring .fg{stroke:var(--acc);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
  .center{position:absolute;text-align:center;top:50%;left:50%;transform:translate(-50%,-44%)}
  .pct{font-size:68px;font-weight:800;letter-spacing:-3px;line-height:1}
  .pct small{font-size:26px;font-weight:700;color:var(--dim);letter-spacing:0}
  .sub{margin-top:8px;color:var(--dim);font-size:16px;font-weight:700}
  .stats{display:flex;justify-content:space-between;margin:20px 0 4px;color:var(--dim);font-size:14px;font-weight:700}
  .stats b{display:block;color:var(--txt);font-size:22px;font-weight:800;margin-top:2px}
  .stats div:last-child{text-align:right}
  .actions{display:flex;gap:10px;margin:18px 0 22px}
  .actions button{flex:1;height:56px;border-radius:16px;font-size:18px;font-weight:800}
  .add{background:#fff;color:#000}
  .sub-btn{background:#000;border:2px solid #fff}
  .add:active,.sub-btn:active{transform:scale(.97)}
  h3{margin:0 0 6px;font-size:13px;font-weight:800;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
  .list{flex:1}
  .row{font-size:17px;font-weight:700;display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid var(--line)}
  .row small{display:block;color:var(--dim);font-size:13px;font-weight:600;margin-top:2px}
  .row .a{font-weight:800;font-variant-numeric:tabular-nums}
  .row .a{color:var(--grn)}
  .row .a.neg{color:var(--red)}
  .empty{color:var(--dim);text-align:center;padding:36px 0;font-size:15px}
  
  /* sheet */
  .shade{position:fixed;inset:0;background:rgba(0,0,0,.8);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
  .shade.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#111;border:1px solid #3a3a3a;border-bottom:0;border-radius:24px 24px 0 0;
    padding:20px 20px calc(env(safe-area-inset-bottom) + 20px);max-width:480px;margin:0 auto;
    transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
  .sheet.on{transform:none}
  .sheet h2{margin:0 0 14px;font-size:22px;font-weight:800}
  input{width:100%;font:inherit;font-size:17px;font-weight:700;color:var(--txt);background:var(--bg);border:1px solid var(--line);
    border-radius:14px;padding:14px;margin-bottom:10px;outline:none;-webkit-user-select:text;user-select:text}
  input:focus{border-color:var(--acc)}
  input.big{font-size:36px;font-weight:800;text-align:center;padding:18px}
  .two{display:grid;grid-template-columns:1fr 90px;gap:10px}
  .btn{width:100%;height:52px;border-radius:14px;font-weight:800;font-size:18px;background:#fff;color:#000;margin-top:4px}
  .btn.ghost{background:#000;color:#fff;border:2px solid #fff}
  .btn.danger{background:none;color:var(--red);height:44px;font-weight:500;font-size:15px}
  .glist button{font-weight:700;display:flex;justify-content:space-between;width:100%;padding:14px 0;border-bottom:1px solid var(--line);font-size:17px;text-align:left}
  .glist button span:last-child{color:var(--dim)}
  .glist button.cur span:first-child{text-decoration:underline;text-underline-offset:4px}
  .links{display:flex;gap:16px;justify-content:center;margin-top:10px}
  .links button{color:var(--dim);font-weight:700;font-size:14px;padding:6px}

  /* ---------- animations ---------- */
  @keyframes fadeUp{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  @keyframes pop{from{opacity:0;transform:scale(.8) rotate(-8deg)}to{opacity:1;transform:none}}
  @keyframes slideIn{from{opacity:0;transform:translateX(-28px) scale(.98);background:#1f1f1f}to{opacity:1;transform:none}}
  @keyframes slideOut{to{opacity:0;transform:translateX(60px);height:0;padding:0;border-width:0}}
  @keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.18)}100%{transform:scale(1)}}
  @keyframes glow{0%,100%{filter:drop-shadow(0 0 2px #fff)}50%{filter:drop-shadow(0 0 14px #fff)}}
  @keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
  @keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  .top{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) both}
  .hero{animation:pop .8s cubic-bezier(.2,.9,.3,1.2) .08s both}
  .stats{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) .25s both}
  .actions{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) .33s both}
  .list h3{animation:fadeUp .6s cubic-bezier(.2,.8,.2,1) .4s both}
  .links{animation:fadeUp .6s ease .6s both}
  .empty{animation:fadeUp .6s ease .5s both}
  .empty b{display:inline-block;font-size:34px;animation:floaty 2.4s ease-in-out infinite}
  .row.in{animation:fadeUp .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(.45s + var(--i) * .06s)}
  .row.new{animation:slideIn .55s cubic-bezier(.2,.9,.3,1) both}
  .row.out{animation:slideOut .3s ease forwards;overflow:hidden}
  .bump{display:inline-block;animation:bump .45s cubic-bezier(.3,1.6,.5,1)}
  b.bump{display:block;transform-origin:left}
  .stats div:last-child b.bump{transform-origin:right}
  .done .ring{animation:glow 2.2s ease-in-out infinite}
  .shake{animation:shake .35s}
  button{transition:transform .15s cubic-bezier(.3,1.5,.5,1),opacity .15s}
  button:active{transform:scale(.94)}
  .goalbtn svg{transition:transform .3s}
  .goalbtn.open svg{transform:rotate(180deg)}
  .icon:active{transform:scale(.88) rotate(-12deg)}
  .sheet.on>*{animation:fadeUp .45s cubic-bezier(.2,.8,.2,1) both}
  .sheet.on>*:nth-child(1){animation-delay:.08s}.sheet.on>*:nth-child(2){animation-delay:.14s}
  .sheet.on>*:nth-child(3){animation-delay:.2s}.sheet.on>*:nth-child(4){animation-delay:.26s}
  .sheet.on>*:nth-child(5){animation-delay:.32s}
  input{transition:border-color .2s,transform .2s,box-shadow .2s}
  input:focus{transform:scale(1.015);box-shadow:0 0 0 3px rgba(255,255,255,.18)}
  .glist button{transition:padding-left .25s,transform .15s}
  .glist button:active{padding-left:10px;transform:none}
  .conf{position:fixed;top:0;left:0;width:9px;height:14px;z-index:20;pointer-events:none;border-radius:2px}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="goalbtn" id="switch"><span id="gname"></span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M2 4l4 4 4-4"/></svg></button>
    <button class="icon" id="edit" aria-label="Редактировать">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg></button>
  </div>

  <div class="hero" id="hero">
    <svg class="ring" viewBox="0 0 120 120"><circle class="bg" cx="60" cy="60" r="54"/><circle class="fg" id="fg" cx="60" cy="60" r="54"/></svg>
    <div class="center"><div class="pct"><span id="pct">0</span><small>%</small></div><div class="sub" id="sub"></div></div>
  </div>

  <div class="stats">
    <div>Накоплено<b id="saved"></b></div>
    <div>Осталось<b id="left"></b></div>
  </div>

  <div class="actions">
    <button class="sub-btn" id="withdraw">− Снять</button>
    <button class="add" id="deposit">+ Пополнить</button>
  </div>

  <div class="list"><h3>История</h3><div id="hist"></div></div>
  <div class="links"><button id="snd"></button><button id="exp">Экспорт</button><button id="imp">Импорт</button></div>
</div>

<div class="shade" id="shade"></div>
<div class="sheet" id="sheet"></div>
<input type="file" id="file" accept="application/json" hidden>

<script>
const $ = s => document.querySelector(s);
const KEY = 'piggy.v1';
const uid = () => Math.random().toString(36).slice(2, 9);
const C = 2 * Math.PI * 54;

/* ---------- sound + haptics ---------- */
const FX = (() => {
  let ctx, on = localStorage.getItem('piggy.sound') !== '0';
  // iOS Safari has no navigator.vibrate; toggling a hidden <input switch> gives a haptic tap (iOS 17.4+)
  const lab = document.createElement('label');
  lab.style.cssText = 'position:fixed;left:-120px;top:0;opacity:0;pointer-events:none';
  lab.innerHTML = '<input type="checkbox" switch>';
  document.body.appendChild(lab);

  const unlock = () => {
    try {
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state !== 'running') ctx.resume();
    } catch {}
  };
  addEventListener('pointerdown', unlock, { passive: true });

  function haptic(taps = 1, gap = 75){
    if (navigator.vibrate) { navigator.vibrate(Array.from({ length: taps * 2 - 1 }, (_, i) => i % 2 ? gap - 15 : 15)); return; }
    for (let i = 0; i < taps; i++) setTimeout(() => lab.click(), i * gap);
  }
  function tone(f, t = 0, d = .12, type = 'sine', v = .15, to){
    if (!on || !ctx) return;
    const t0 = ctx.currentTime + t, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + d);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(v, t0 + .008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    o.connect(g).connect(ctx.destination); o.start(t0); o.stop(t0 + d + .02);
  }
  return {
    get on(){ return on; },
    toggle(){ on = !on; localStorage.setItem('piggy.sound', on ? '1' : '0'); unlock(); if (on) this.ok(); return on; },
    tap(){ tone(1400, 0, .035, 'triangle', .05); haptic(1); },
    open(){ tone(520, 0, .09, 'sine', .07, 760); },
    ok(){ tone(660, 0, .09, 'triangle', .1); tone(990, .08, .14, 'triangle', .1); haptic(1); },
    deposit(){ tone(988, 0, .08, 'square', .06); tone(1319, .07, .26, 'square', .06); tone(1976, .07, .26, 'sine', .05); haptic(2, 80); },
    withdraw(){ tone(520, 0, .1, 'triangle', .12, 440); tone(330, .09, .22, 'triangle', .12, 220); haptic(1); },
    del(){ tone(300, 0, .16, 'sawtooth', .05, 90); haptic(1); },
    error(){ tone(150, 0, .09, 'square', .07); tone(150, .12, .09, 'square', .07); haptic(3, 60); },
    win(){ [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * .09, .3, 'triangle', .1)); haptic(4, 90); }
  };
})();

let S = load() || {
  active: null,
  goals: [{ id: 'g1', name: 'Asus Zenbook', target: 2500, cur: '$', tx: [] }]
};
if (!S.active) S.active = S.goals[0].id;

function load(){ try { return JSON.parse(localStorage.getItem(KEY)); } catch { return null; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(S)); }
const goal = () => S.goals.find(g => g.id === S.active) || S.goals[0];
const sum = g => g.tx.reduce((a, t) => a + t.amt, 0);
const fmt = (n, cur) => {
  const s = Math.round(n * 100) / 100;
  return s.toLocaleString('ru-RU', { maximumFractionDigits: 2 }).replace(/ /g, ' ') + ' ' + cur;
};

let prev = { pct: 0, saved: 0, left: 0, id: null, done: false };
let newId = null;

function tween(el, from, to, dur, f){
  cancelAnimationFrame(el._r);
  if (from === to) { el.textContent = f(to); return; }
  const t0 = performance.now();
  const step = t => {
    const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 4);
    el.textContent = f(from + (to - from) * e);
    if (k < 1) el._r = requestAnimationFrame(step);
  };
  el._r = requestAnimationFrame(step);
}
function bump(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

function render(){
  const g = goal(), saved = sum(g), left = Math.max(0, g.target - saved);
  const p = g.target > 0 ? Math.max(0, Math.min(1, saved / g.target)) : 0;
  const pct = Math.floor(p * 100), done = p >= 1;
  const first = prev.id === null, switched = !first && prev.id !== g.id;
  const changed = !first && !switched;

  $('#gname').textContent = g.name;
  if (switched) { $('#hero').style.animation = 'none'; void $('#hero').offsetWidth; $('#hero').style.animation = 'pop .6s cubic-bezier(.2,.9,.3,1.2) both'; }
  $('#sub').textContent = done ? 'Цель достигнута 🎉' : 'из ' + fmt(g.target, g.cur);

  const from = first || switched ? { pct: 0, saved: 0, left: g.target } : prev;
  tween($('#pct'), from.pct, pct, 1100, v => Math.floor(v));
  tween($('#saved'), from.saved, saved, 1100, v => fmt(v, g.cur));
  tween($('#left'), from.left, left, 1100, v => fmt(v, g.cur));
  if (changed) {
    if (pct !== prev.pct) bump($('#pct'));
    if (saved !== prev.saved) { bump($('#saved')); bump($('#left')); }
  }

  const fg = $('#fg');
  fg.style.strokeDasharray = C;
  if (first || switched) {
    fg.style.transition = 'none'; fg.style.strokeDashoffset = C; void fg.getBoundingClientRect();
    fg.style.transition = 'stroke-dashoffset 1.2s cubic-bezier(.2,.8,.2,1)';
  }
  requestAnimationFrame(() => { fg.style.strokeDashoffset = C * (1 - p); });
  $('#hero').classList.toggle('done', done);
  if (done && !prev.done && changed) confetti();

  const h = $('#hist'), anim = first || switched;
  if (!g.tx.length) {
    h.innerHTML = '<div class="empty"><b>🐷</b><br>Пока пусто. Начни с первого взноса.</div>';
  } else {
    h.innerHTML = [...g.tx].reverse().map((t, i) => `
      <div class="row ${t.id === newId ? 'new' : anim ? 'in' : ''}" style="--i:${i}" data-id="${t.id}">
        <div>${t.note ? esc(t.note) : (t.amt >= 0 ? 'Пополнение' : 'Снятие')}
          <small>${new Date(t.date).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' })}</small></div>
        <div class="a ${t.amt < 0 ? 'neg' : ''}">${t.amt > 0 ? '+' : '−'}${fmt(Math.abs(t.amt), g.cur)}</div>
      </div>`).join('');
  }
  newId = null;
  prev = { pct, saved, left, id: g.id, done };
}

function confetti(){
  const cols = ['#fff', '#30e060', '#fff', '#ff3b30'];
  for (let i = 0; i < 60; i++) {
    const d = document.createElement('div'); d.className = 'conf';
    d.style.background = cols[i % cols.length];
    document.body.appendChild(d);
    const x0 = innerWidth / 2, y0 = innerHeight * .38, a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 260;
    d.animate([
      { transform: `translate(${x0}px,${y0}px) rotate(0)`, opacity: 1 },
      { transform: `translate(${x0 + Math.cos(a) * v}px,${y0 + Math.sin(a) * v - 80}px) rotate(${Math.random() * 540}deg)`, opacity: 1, offset: .45 },
      { transform: `translate(${x0 + Math.cos(a) * v * 1.2}px,${y0 + Math.sin(a) * v + 420}px) rotate(${Math.random() * 900}deg)`, opacity: 0 }
    ], { duration: 1600 + Math.random() * 600, easing: 'cubic-bezier(.2,.6,.4,1)' }).onfinish = () => d.remove();
  }
  FX.win();
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* sheets */
function open(html){ FX.open(); $('#sheet').classList.remove('on'); void $('#sheet').offsetWidth; $('#sheet').innerHTML = html; $('#shade').classList.add('on'); $('#sheet').classList.add('on'); }
function close(){ $('#shade').classList.remove('on'); $('#sheet').classList.remove('on'); $('#switch').classList.remove('open'); document.activeElement.blur(); }
const shake = el => { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); el.focus(); };
$('#shade').onclick = close;
const num = v => parseFloat(String(v).replace(/\s/g, '').replace(',', '.'));

function moneySheet(sign){
  const g = goal();
  open(`<h2>${sign > 0 ? 'Пополнить' : 'Снять'}</h2>
    <input class="big" id="amt" inputmode="decimal" placeholder="0" autocomplete="off">
    <input id="note" placeholder="Заметка (необязательно)" autocomplete="off">
    <button class="btn" id="ok">${sign > 0 ? 'Добавить' : 'Снять'}</button>`);
  setTimeout(() => $('#amt').focus(), 320);
  $('#ok').onclick = () => {
    const v = num($('#amt').value);
    if (!(v > 0)) { FX.error(); return shake($('#amt')); }
    const id = uid(); newId = id;
    g.tx.push({ id, amt: sign * v, date: Date.now(), note: $('#note').value.trim() });
    save(); render(); close();
    sign > 0 ? FX.deposit() : FX.withdraw();
  };
}

function goalForm(g){
  const isNew = !g;
  open(`<h2>${isNew ? 'Новая цель' : 'Цель'}</h2>
    <input id="n" placeholder="Название" value="${g ? esc(g.name) : ''}" autocomplete="off">
    <div class="two"><input id="t" inputmode="decimal" placeholder="Сумма" value="${g ? g.target : ''}" autocomplete="off">
    <input id="c" placeholder="Валюта" value="${g ? esc(g.cur) : '$'}" maxlength="4"></div>
    <button class="btn" id="ok">Сохранить</button>
    ${!isNew && S.goals.length > 1 ? '<button class="btn danger" id="del">Удалить цель</button>' : ''}`);
  $('#ok').onclick = () => {
    const name = $('#n').value.trim(), target = num($('#t').value), cur = $('#c').value.trim() || '$';
    if (!name) { FX.error(); return shake($('#n')); }
    if (!(target > 0)) { FX.error(); return shake($('#t')); }
    if (isNew) { const ng = { id: uid(), name, target, cur, tx: [] }; S.goals.push(ng); S.active = ng.id; }
    else Object.assign(g, { name, target, cur });
    save(); render(); close(); FX.ok();
  };
  if ($('#del')) $('#del').onclick = () => {
    if (!confirm('Удалить цель «' + g.name + '» вместе с историей?')) return;
    S.goals = S.goals.filter(x => x.id !== g.id); S.active = S.goals[0].id;
    save(); render(); close(); FX.del();
  };
}

function switchSheet(){
  $('#switch').classList.add('open');
  open(`<h2>Цели</h2><div class="glist">${S.goals.map(g =>
    `<button data-id="${g.id}" class="${g.id === S.active ? 'cur' : ''}"><span>${esc(g.name)}</span><span>${Math.floor(Math.min(1, sum(g) / g.target) * 100)}%</span></button>`).join('')}</div>
    <button class="btn ghost" id="new" style="margin-top:14px">+ Новая цель</button>`);
  document.querySelectorAll('.glist button').forEach(b => b.onclick = () => { S.active = b.dataset.id; save(); render(); close(); FX.ok(); });
  $('#new').onclick = () => goalForm(null);
}

$('#deposit').onclick = () => moneySheet(1);
$('#withdraw').onclick = () => moneySheet(-1);
$('#edit').onclick = () => goalForm(goal());
$('#switch').onclick = switchSheet;
$('#hist').onclick = e => {
  const r = e.target.closest('.row'); if (!r) return;
  if (confirm('Удалить эту запись?')) { FX.del(); r.classList.add('out'); setTimeout(() => { const g = goal(); g.tx = g.tx.filter(t => t.id !== r.dataset.id); save(); render(); }, 280); }
};

/* backup */
$('#exp').onclick = () => {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' }));
  a.download = 'piggy-backup.json'; a.click();
};
$('#imp').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!Array.isArray(d.goals) || !d.goals.length) throw 0;
    if (!confirm('Заменить текущие данные импортом?')) return;
    S = d; if (!S.active) S.active = S.goals[0].id; save(); render();
  } catch { alert('Не получилось прочитать файл'); }
  e.target.value = '';
};

document.addEventListener('pointerdown', e => { if (e.target.closest('button') && !e.target.closest('#snd')) FX.tap(); }, { passive: true });
const sndBtn = $('#snd'); const sndLabel = () => sndBtn.textContent = 'Звук: ' + (FX.on ? 'вкл' : 'выкл');
sndBtn.onclick = () => { FX.toggle(); sndLabel(); }; sndLabel();
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
